
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adnan Mobiles</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #080808;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 20px 15px;
        }

        /* Top Header */
        .top-header {
            text-align: center;
            margin-top: 10px;
            margin-bottom: 25px;
        }
        .top-header h2 {
            color: #ffcc00;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 1.5px;
        }
        .top-header p {
            color: #aaaaaa;
            font-size: 11px;
            letter-spacing: 1px;
            margin-top: 2px;
        }

        /* Services Pill Border */
        .services-pill {
            border: 1px solid #7a6212;
            border-radius: 25px;
            padding: 10px 20px;
            font-size: 11px;
            color: #e6c229;
            letter-spacing: 1.5px;
            text-align: center;
            margin-bottom: 25px;
            background-color: rgba(255, 204, 0, 0.02);
            font-weight: 600;
        }

        /* Main Hero Circle Card */
        .hero-circle {
            border: 1px solid #222222;
            border-radius: 50%;
            padding: 45px 25px;
            text-align: center;
            max-width: 380px;
            box-shadow: 0 0 60px rgba(255, 204, 0, 0.03);
            margin-bottom: 30px;
            background: radial-gradient(circle, rgba(255, 204, 0, 0.05) 0%, rgba(0,0,0,0) 70%);
        }

        .hero-circle h1 {
            font-size: 32px;
            font-weight: 900;
            line-height: 1.1;
            letter-spacing: 1px;
            margin-bottom: 5px;
            color: #ffffff;
        }

        .hero-circle h1 .yellow {
            color: #ffcc00;
            display: block;
        }

        .hero-circle h3 {
            font-size: 20px;
            font-weight: 500;
            color: #ffffff;
            margin-bottom: 15px;
        }

        .hero-circle p {
            color: #b0b0b0;
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .location {
            font-size: 15px;
            color: #ffffff;
            font-weight: 500;
        }

        /* Action Buttons */
        .btn-container {
            display: flex;
            gap: 12px;
            width: 100%;
            max-width: 360px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 15px;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-call {
            background-color: #ffcc00;
            color: #000000;
            border: none;
        }

        .btn-whatsapp {
            background-color: transparent;
            color: #ffcc00;
            border: 1px solid #ffcc00;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <div class="top-header">
        <h2>ADNAN MOBILES</h2>
        <p>COMPUTER REPAIRING CENTER</p>
    </div>

    <!-- Tagline Pill -->
    <div class="services-pill">
        MOBILE • COMPUTER • DIGITAL SERVICES
    </div>

    <!-- Center Circle Content -->
    <div class="hero-circle">
        <h1>ADNAN <span class="yellow">MOBILES</span></h1>
        <h3>and Computer Repairing Center</h3>
        <p>Professional mobile & computer solutions, software services, graphic designing and digital work — all under one roof.</p>
        <div class="location">
            📍 Near UBL, Basharat
        </div>
    </div>

    <!-- Buttons -->
    <div class="btn-container">
        <a href="tel:+923000000000" class="btn btn-call">
            <i class="fas fa-phone"></i> Call Now
        </a>
        <a href="https://wa.me/923000000000" class="btn btn-whatsapp">
            <i class="fab fa-whatsapp"></i> WhatsApp
        </a>
    </div>

</body>
</html>
